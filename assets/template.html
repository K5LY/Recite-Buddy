<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}·分章背诵助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23{{C1HEX}}'/%3E%3Cpath d='M8 22V10l4 6 4-6v12' stroke='%23F7F6F1' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="{{APPICON}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{APPTITLE}}">
<meta name="theme-color" content="{{C1}}">
<style>
:root{
  --paper:#F6F4EE; --paper2:#EDEAE1; --ink:#23272B; --ink2:#5A5A55;
  --line:#DFDBD0; --card:#FFFFFF; --red:{{C1}}; --blue:{{C2}}; --redbg:{{REDBG}}; --bluebg:{{BLUEBG}};
  --ok:#3E7C4F; --warn:#A8762E;
}
@supports (background: color-mix(in srgb, red 10%, white)){
  :root{ --redbg:color-mix(in srgb,var(--red) 10%,#fff); --bluebg:color-mix(in srgb,var(--blue) 10%,#fff); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.65;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit}

/* ===== 顶部 ===== */
header{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 14px 8px;position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand .t{font-size:17px;font-weight:700;letter-spacing:.5px}
.brand .s{font-size:12px;color:var(--ink2)}
.searchwrap{position:relative}
.searchwrap input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;font-size:16px;outline:none}
.searchwrap input:focus{border-color:var(--red)}
.searchres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.08);max-height:320px;overflow:auto;z-index:50;display:none}
.searchres.open{display:block}
.searchres .it{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.searchres .it:last-child{border-bottom:none}
.searchres .it .k{color:var(--red);font-size:12px;margin-right:6px}
.searchres .it:active{background:var(--paper2)}

/* ===== 主区 ===== */
main{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px calc(76px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.view{display:none}
.view.active{display:block}

/* 章节列表 */
.sec-title{font-size:13px;color:var(--ink2);margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:4px;height:14px;border-radius:2px}
.sec-title.cn::before{background:var(--red)}
.sec-title.fn::before{background:var(--blue)}
.ch-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;cursor:pointer;display:block;width:100%;text-align:left;padding:0}
.ch-card .head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.ch-card .no{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px;flex:0 0 auto}
.ch-card.cn .no{background:var(--red)}
.ch-card.fn .no{background:var(--blue)}
.ch-card .tt{font-size:16px;font-weight:700}
.ch-card .kw{display:flex;flex-wrap:wrap;gap:6px;padding:2px 14px 10px}
.ch-card .kw span{font-size:12px;color:var(--ink2);background:var(--paper2);border-radius:20px;padding:2px 9px}
.ch-card:active{background:var(--paper2)}

/* 章详情 */
.crumbs{font-size:13px;color:var(--ink2);margin-bottom:10px}
.crumbs b{cursor:pointer;color:var(--red)}
.ch-title{font-size:21px;font-weight:700;margin:0 0 2px;line-height:1.3}
.ch-sub{font-size:13px;color:var(--ink2);margin-bottom:12px}
.sec-block{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sec-block .sb-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:16px;letter-spacing:.3px;cursor:pointer;user-select:none}
.sec-block .sb-h .arr{margin-left:auto;color:var(--ink2);font-size:12px;transition:transform .18s}
.sec-block.open .sb-h .arr{transform:rotate(180deg)}
.sec-block .sb-b{display:none;padding:2px 14px 12px;border-top:1px solid var(--line)}
.sec-block.open .sb-b{display:block}
.sec-block .sb-b p{margin:0 0 14px;font-size:16px;text-align:justify;overflow-wrap:anywhere;word-break:break-word}
.sec-block .sb-b p b{color:var(--red)}
.exam-item{margin:12px 0;font-size:15px}
.exam-item b{color:var(--ink);font-weight:700}
.sb-sub{font-size:14px;font-weight:700;color:var(--ink);margin:14px 0 4px}
.sb-sub:first-child{margin-top:2px}
.mis-item{margin:10px 0;font-size:15px;color:#4A3A2A;background:var(--redbg);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.tips-box{margin:10px 0;font-size:15px;background:var(--bluebg);border-radius:8px;padding:8px 10px;color:#24404C;display:flex;gap:8px;align-items:flex-start}
.mis-item .num,.tips-box .num{flex:none;width:20px;height:20px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.mis-item .num{background:var(--red)}
.tips-box .num{background:var(--blue)}
.mis-item .tx,.tips-box .tx{flex:1}
table.sm{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;margin-top:6px}
table.sm th{background:var(--paper2);border:1px solid var(--line);padding:6px 5px;text-align:center;font-weight:700}
table.sm td{border:1px solid var(--line);padding:6px 5px;vertical-align:top}
table.sm td:first-child{text-align:center;font-weight:600;color:var(--red)}
.linkbar{margin-top:12px}
.linkbar .lb-t{font-size:13px;color:var(--ink2);margin-bottom:6px}
.chip{display:inline-block;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:0 6px 6px 0;cursor:pointer;color:var(--ink)}
.chip:active{background:var(--paper2)}
.chip.w{background:var(--bluebg);border-color:#BFD4DE;color:#24404C}

/* 闪卡 */
.recite-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.rbtn{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px}
.rbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card-wrap{perspective:1200px;margin:6px 0 10px}
.flashcard{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px 20px;text-align:center;position:relative;transform-style:preserve-3d;transition:transform .3s;cursor:pointer}
.flashcard.flip{transform:rotateY(180deg)}
.flashcard .face{backface-visibility:hidden;width:100%}
.flashcard .back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:flex-start;padding:24px 20px;overflow:hidden;backface-visibility:hidden}
.fc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px;min-height:24px}
.fc-tag{font-size:12px;color:#fff;border-radius:999px;padding:3px 10px}
.fc-tag.cn{background:var(--red)} .fc-tag.fn{background:var(--blue)}
.fc-st{font-size:12px;font-weight:600}
.fc-st.known{color:var(--ok)} .fc-st.again{color:var(--warn)}
.fc-q{font-size:17px;font-weight:700;line-height:1.6}
.fc-tip{display:inline-flex;align-items:center;gap:6px;margin:14px auto 0;padding:7px 24px;border-radius:999px;background:var(--redbg);color:var(--red);font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.fc-tip:active{opacity:.8}
.fc-a{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:15.5px;text-align:left;line-height:1.7;margin:0}
.recite-btns{display:flex;gap:10px}
.fc-sched{font-size:12px;color:var(--ink2);text-align:center;margin:0 0 10px;padding:4px 8px;background:var(--paper);border:1px dashed var(--line);border-radius:8px}
.back-btns{flex:0 0 auto;display:flex;gap:10px;margin-top:12px}
.back-btns button{flex:1;border-radius:12px;padding:11px 0;font-size:15px;font-weight:700;color:#fff;border:0}
.recite-btns button{flex:1;border-radius:12px;padding:12px 0;font-size:15px;font-weight:700;color:#fff}
.b-known{background:var(--ok)} .b-again{background:var(--warn)}
.progress{font-size:13px;color:var(--ink2);text-align:center;margin-bottom:8px;position:relative}
.progress .prev{position:absolute;left:0;top:0;font-size:13px;color:var(--ink2);cursor:pointer;background:none;border:none;padding:2px 6px}
.progress .bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
.recite-end{text-align:center;padding:30px 10px}
.recite-end .big{font-size:44px;font-weight:800;color:var(--red);line-height:1}
.recite-end .txt{font-size:15px;color:var(--ink2);margin:10px 0 16px}

/* 线索 */
.thread-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.thread-card .th-h{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.thread-card .th-h .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:0 0 auto}
.thread-card.fn .th-h .dot{background:var(--blue)}
.thread-card .th-h .arr{margin-left:auto;color:var(--ink2);font-size:12px;transition:transform .18s}
.thread-card.open .th-h .arr{transform:rotate(180deg)}
.thread-card .th-h .tt{font-size:15px;font-weight:700}
.thread-card .th-desc{font-size:13px;color:var(--ink2);padding:0 14px 10px;display:none}
.thread-card.open .th-desc{display:block}
.thread-card .th-body{display:none;padding:0 14px 12px}
.thread-card.open .th-body{display:block}
.tnode{border-left:2px solid var(--line);margin:0 0 0 5px;padding:0 0 12px 14px;position:relative}
.tnode::before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.thread-card.fn .tnode::before{background:var(--blue)}
.tnode:last-child{border-left-color:transparent}
.tnode .nt{font-size:15px;font-weight:700;cursor:pointer}
.tnode .nt:active{color:var(--red)}
.tnode .nd{font-size:13.5px;color:var(--ink2);margin-top:2px}
.tnode .nl{margin-top:6px}

/* 档案库 */
.wfilter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:12px;cursor:pointer}
.wcard:active{background:var(--paper2)}
.wcard .wt{font-size:15.5px;font-weight:700}
.wcard .wm{font-size:12.5px;color:var(--ink2);margin-top:2px}
.wcard .wtg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.wcard .wtg span{font-size:12px;color:var(--ink2);background:var(--paper2);border-radius:20px;padding:1px 8px}

/* 抽屉（作品详情） */
.drawer{position:fixed;left:0;right:0;bottom:0;top:0;z-index:100;pointer-events:none}
.drawer .mask{position:absolute;inset:0;background:rgba(20,22,24,.4);opacity:0;transition:opacity .2s}
.drawer .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;max-height:82dvh;overflow-y:auto;transform:translateY(102%);transition:transform .22s;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
.drawer.open{pointer-events:auto}
.drawer.open .mask{opacity:1}
.drawer.open .sheet{transform:translateY(0)}
.grip{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.dw-name{font-size:20px;font-weight:800;line-height:1.3}
.dw-meta{font-size:13px;color:var(--ink2);margin:4px 0 12px}
.dw-row{margin:10px 0}
.dw-row .lb{font-size:12px;color:var(--ink2);margin-bottom:3px}
.dw-row .val{font-size:15px;background:#fff;border-radius:10px;padding:9px 12px;border:1px solid var(--line)}
.dw-row .val b{color:var(--red)}
.dw-img{margin:10px 0 2px;text-align:center}
.dw-img img{max-width:100%;max-height:250px;border-radius:10px;display:block;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.16);cursor:zoom-in;transition:max-height .25s ease;background:#fff}
.dw-img img.big{max-height:76dvh;cursor:zoom-out}
.dw-img-cap{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.5}
.dw-img-src{font-size:11.5px;color:var(--ink2);margin-top:3px}
.dw-img img.web{border:1px solid var(--blue)}
.img-note{font-size:12.5px;color:var(--ink2);background:var(--bluebg);border-radius:8px;padding:7px 10px;margin:0 0 10px;line-height:1.6}
.term-th{display:inline-block;width:92px;margin:5px 6px 5px 0;vertical-align:top;text-align:center;cursor:pointer}
.term-th img{width:92px;height:70px;object-fit:cover;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.14);background:#fff}
.term-th span{display:block;font-size:12px;color:var(--ink2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 底部导航 */
nav{flex:0 0 auto;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid #D8D2C4;box-shadow:0 -3px 12px rgba(35,39,43,.07);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
/* 综合页（overview3 数据驱动，可空） */
.ov{margin:0}
.ov-sec{margin-bottom:14px}
.ov-h{font-weight:700;font-size:14px;margin:14px 0 8px;color:var(--ink)}
.ov-grid,.bk-grid{display:flex;flex-wrap:wrap;gap:8px}
.ov-card{flex:1 1 100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;line-height:1.7;background:var(--card)}
.ov-t{font-weight:700;margin-bottom:4px;color:var(--ink)}
.ov-note{font-size:12.5px;color:var(--ink2);line-height:1.75;background:var(--bluebg);border-radius:6px;padding:8px 10px;margin-top:8px}
.ov-dt{margin:0 2px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.ov-dt summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;list-style:none;min-height:44px;-webkit-tap-highlight-color:transparent}
.ov-dt summary::-webkit-details-marker{display:none}
.ov-dt summary::after{content:"＋";color:var(--ink2);font-size:16px;font-weight:400;flex:none}
.ov-dt[open] summary::after{content:"－"}
.ov-sm-t{font-size:11px;color:var(--ink2);font-weight:400;flex:none}
.ov-inner{padding:2px 10px 12px;border-top:1px dashed var(--line)}
.ov-inner .ov{margin:0}
.bk-card{flex:1 1 100%;border:1px solid;border-left-width:4px;border-radius:8px;padding:10px 12px;font-size:13px;background:var(--card)}
.bk-top{display:flex;align-items:center;gap:6px}
.bk-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--red)}
.bk-star{color:#C2A24A;font-size:12px;letter-spacing:1px}
.bk-n{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
.bk-sh{font-size:12px;color:var(--ink2);margin-top:3px}
.bk-lv{font-size:11px;font-weight:700;border:1px solid;border-radius:9px;padding:1px 7px;flex:none}
/* 书分组 header（chapters.book + config.bookmeta 驱动，无则不用） */
.book-head{display:flex;align-items:center;gap:8px;margin:24px 4px 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.book-head .b-dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.book-head b{font-size:16px;color:var(--ink)}
.book-head .b-meta{font-size:12px;color:var(--ink2)}
/* 章节卡片考点数徽标（书色边框+文字；0 考点 → 灰色「精读」） */
.qn-badge{margin-left:auto;font-size:11px;font-weight:700;border:1px solid;border-radius:9px;padding:2px 9px;flex:none;white-space:nowrap}
.qn-badge.zero{color:var(--ink2);border-color:var(--line)}
.ch-card .head{gap:10px}
/* 页脚水印：低调小字，不参与交互、不遮挡内容 */
.rb-footer{text-align:center;font-size:11px;line-height:1.6;color:var(--ink2);padding:2px 16px calc(64px + env(safe-area-inset-bottom));opacity:.72;user-select:none;pointer-events:none}
nav .tab{flex:1;text-align:center;padding:9px 0 8px;color:var(--ink2);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav .tab .ic{width:22px;height:22px}
nav .tab.on{color:var(--red);font-weight:700}
nav .tab.fn-side.on{color:var(--blue)}

.empty{text-align:center;color:var(--ink2);font-size:14px;padding:30px 10px}

/* 知识内链与返回 */
.ilink{color:var(--red);text-decoration:underline;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,var(--red) 35%,transparent);font-weight:600}
.ilink:active{background:var(--redbg);border-radius:3px}
.backbar{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);margin:0 0 10px;flex-wrap:wrap}
.backbar b{color:var(--red);cursor:pointer;font-weight:600;padding:2px 4px}
.backbar b:active{background:var(--redbg);border-radius:4px}
.term-def{font-size:15px;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}

/* 考点热链与 QA 抽屉 */
.qa-hint{font-size:12.5px;color:var(--ink2);background:var(--bluebg);border-radius:8px;padding:6px 10px;margin:8px 0 4px}
.exam-item{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:opacity .15s}
.exam-item:active{opacity:.85}
.exam-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exam-link{flex:0 0 auto;color:#fff;background:var(--red);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.exam-link.fn-side{background:var(--blue)}
.exam-arr{flex:0 0 auto;font-size:12px;color:var(--ink2);white-space:nowrap}
.exam-body{margin-top:7px;font-size:15px;line-height:1.65;color:var(--ink);overflow-wrap:anywhere;word-break:break-word}
.qa-head{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.qa-level{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:3px 9px}
.qa-level.cn{background:var(--red)} .qa-level.fn{background:var(--blue)}
.qa-q{font-size:15px;color:#3A3A35;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:4px 0 2px}
.qa-list,.qa-tpl{margin:0;padding-left:20px;font-size:15px}
.qa-list li,.qa-tpl li{margin:12px 0}
.qa-tpl{list-style:none;counter-reset:qa}
.qa-tpl li{counter-increment:qa;position:relative}
.qa-tpl li::before{content:counter(qa,decimal-leading-zero);position:absolute;left:-26px;top:1px;font-size:12px;font-weight:700;color:var(--red);background:var(--redbg);border-radius:4px;padding:0 5px}
.qa-goto{margin-top:14px;text-align:center;font-size:15px;font-weight:700;color:var(--red);cursor:pointer;background:#fff;border:1px solid var(--red);border-radius:12px;padding:11px 0}
ruby{ruby-align:center}
rt{font-size:.6em;line-height:1;color:#6E6A61;font-weight:400}

@media (min-width:900px){
  main{max-width:760px;margin:0 auto}
  header{max-width:760px;margin:0 auto;left:0;right:0}
  nav{width:min(760px,100vw);max-width:760px;left:50%;right:auto;transform:translateX(-50%);justify-content:center;gap:14px;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}

<script>
/* ===== 数据注入占位 ===== */
const CH = {{CH}};
const WK = {{WK}};
const CD = {{CD}};
const TH = {{TH}};
const TM = {{TM}};
const QA = {{QA}};
const PY = {{PY}};
/* ===== 工具 ===== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const partOf = ch => CH.find(c=>c.id===ch);
const chName = ch => {const c=partOf(ch); if(!c) return ''; const nm=c.title.replace(/^第.章\s*/,''); const b=(c.book&&BOOKMETA[c.book]&&BOOKMETA[c.book].short)?BOOKMETA[c.book].short:''; return b? b+' · '+nm : c.no+' · '+nm;};
const WKIDX = {}; WK.forEach(w=>WKIDX[w.id]=w);
const TMIDX = {}; TM.forEach(t=>TMIDX[t.id]=t);
/* 知识内链词典：作品名 + 自动链接术语，长词优先 */
const LINK_DICT = [];
WK.forEach(w=>{ if(w.name.length>=2) LINK_DICT.push({name:w.name,type:'w',id:w.id}); });
TM.forEach(t=>{ if(t.auto && t.name.length>=2) LINK_DICT.push({name:t.name,type:'t',id:t.id}); });
// 别名：人物简称、机构简称与展览别称，补充进词典（长词优先，避免误链）
const ALIAS = {{ALIAS}};
ALIAS.forEach(a=>LINK_DICT.push({name:a[0],type:a[1],id:a[2]}));
LINK_DICT.sort((a,b)=>b.name.length-a.name.length);
function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
let HAS_LB=true;
try{ new RegExp('(?<=a)b'); }catch(e){ HAS_LB=false; }
function linkify(txt){
  if(!txt) return '';
  const s = esc(txt);
  const ranges = [];
  for(const e of LINK_DICT){
    const lb = HAS_LB ? '(?<![A-Za-z0-9])' : '(?:^|[^A-Za-z0-9])';
    const re = new RegExp(lb + escReg(e.name) + '(?![A-Za-z0-9])','g');
    let m;
    while((m=re.exec(s))){
      const pre = m[0].length - e.name.length; // 降级写法可能多捕获 0/1 个前缀字符，计入偏移
      const st=m.index+pre, en=st+e.name.length;
      if(ranges.some(r=>st<r.en&&en>r.st)) continue;
      ranges.push({st,en,name:e.name,type:e.type,id:e.id});
    }
  }
  if(!ranges.length) return s;
  ranges.sort((a,b)=>a.st-b.st);
  let out='', pos=0;
  for(const r of ranges){
    out += s.slice(pos,r.st);
    out += '<a class="ilink" onclick="linkGo('+(r.type==='w'?'openWork':'openTerm')+',\''+r.id+'\',event)">'+r.name+'</a>';
    pos = r.en;
  }
  return out + s.slice(pos);
}
function linkGo(fn,id,e){ if(e&&e.stopPropagation) e.stopPropagation(); fn(id); }
/* 生僻字注音：仅标真正生僻的字词（数据已在 py_data.json 精简） */
function applyRuby(txt){
  if(!txt) return txt;
  const py = PY.py||{}, kw = PY.kw||{};
  let t = String(txt);
  for(const k in kw){ t = t.split(k).join('\x01'+k+'\x02'+kw[k]+'\x03'); }
  const buf = []; let i = 0;
  while(i < t.length){
    if(t[i]==='\x01'){
      const j = t.indexOf('\x03', i);
      if(j===-1){ buf.push(t[i]); i++; continue; }
      buf.push(t.slice(i, j+1)); i = j+1;
    } else {
      const ch = t[i];
      if(py[ch]) buf.push('\x01'+ch+'\x02'+py[ch]+'\x03');
      else buf.push(ch);
      i++;
    }
  }
  return buf.join('').replace(/\x01([^\x02]+)\x02([^\x03]+)\x03/g, '<ruby>$1<rt>$2</rt></ruby>');
}
/* 统一渲染：先知识内链，再注音 */
const fmt = txt => applyRuby(linkify(txt));
/* 自链剥离：抽屉正文中指向当前条目自身的链接还原为纯文本（避免点了没意义） */
function stripSelf(html, id){
  if(!html) return html;
  return html.replace(new RegExp('<a class="ilink" onclick="linkGo\\((openWork|openTerm),\\\''+id+'\\\',event\\)">([^<]*)</a>','g'), '$2');
}
const store = {get(k,d){try{const v=localStorage.getItem('{{PREFIX}}'+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('{{PREFIX}}'+k,JSON.stringify(v));}catch(e){}}};
let current = {view:'chapters', ch:null, reciteFilter:'all', rq:null, wfilter:'all', wq:''};
const fnParts = {{FN_PARTS}} || []; // 副色篇名列表（config.fn_parts），数据驱动主副色
const BOOKMETA = {{BOOKMETA}} || {};  // 书级元数据（config.bookmeta）：{书id:{short,color,desc}}，数据驱动书分组
const OVERVIEW3 = {{OVERVIEW3}} || ''; // 综合页 HTML 块（config.overview3，数据驱动，可空）

const isFnPart = p => fnParts.includes(p);

/* ===== 路由 ===== */
function router(){
  const h = location.hash.replace(/^#\/?/,'');
  let m;
  if((m=h.match(/^chapter\/(\w+)$/))) renderChapter(m[1]);
  else if(h==='recite') renderRecite();
  else if(h==='threads') renderThreads();
  else if(h==='works') renderWorks();
  else renderChapters();
  if(!h.startsWith('chapter/')){ dstack.length = 0; $('#drawer').classList.remove('open'); }
  setTab(h);
  $('#main').scrollTop = 0; window.scrollTo(0,0);
  closeSearch();
}
function nav(view){ location.hash = '#'+view; }
function setTab(h){
  const v = h.startsWith('chapter')?'chapters':(h===''?'chapters':h);
  document.querySelectorAll('nav .tab').forEach(t=>{
    t.classList.toggle('on', t.dataset.view===v);
  });
}

/* ===== 视图渲染 ===== */
const chStack = []; // 章节返回栈：{t:'ch',id} 或 {t:'d',id,k}
function gotoChapter(id){
  if(location.hash.startsWith('#chapter/')) chStack.push({t:'ch', id:current.ch});
  if($('#drawer').classList.contains('open')){
    const top = dstack[dstack.length-1];
    if(top){
      if(top.t==='q') chStack.push({t:'d', k:'q', ch:top.ch, i:top.i});
      else chStack.push({t:'d', id:top.id, k:top.t, ch:current.ch});
    }
    dstack.length = 0;
    $('#drawer').classList.remove('open');
  }
  nav('chapter/'+id);
}
function backChapter(){
  const e = chStack.pop(); if(!e) return;
  if(e.t==='ch') nav('chapter/'+e.id);
  else {
    const chid = e.ch || (current.ch && location.hash.startsWith('#chapter/') ? current.ch : null);
    if(chid) nav('chapter/'+chid);
    else if(current.ch && location.hash.startsWith('#chapter/')) renderChapter(current.ch);
    if(e.k==='q') openQA(e.ch, e.i);
    else if(e.k==='w') openWork(e.id);
    else openTerm(e.id);
  }
}
function taglineOf(ch){
  const labs = ch.sections.map(s=>s[0]).filter(Boolean).slice(0,3).map(t=>t.replace(/[。；]+$/,''));
  return labs.length? labs.join(' · ') : '精读';
}
function renderChapters(){
  chStack.length = 0;
  let h = '';
  if(OVERVIEW3) h += '<div class="ov">'+OVERVIEW3+'</div>';
  h += '<div class="sec-title cn">{{OVERVIEW}}</div>';
  h += '<div style="font-size:13.5px;color:var(--ink2);margin:0 2px 10px">{{OVERVIEW2}}</div>';
  const byBook = {};
  CH.forEach(c=>{ if(c.book){ (byBook[c.book]=byBook[c.book]||[]).push(c); } });
  const bidList = Object.keys(byBook);
  if(bidList.length){
    bidList.forEach(bid=>{
      const list = byBook[bid];
      const meta = BOOKMETA[bid] || {};
      const totalQa = list.reduce((s,c)=>s+(c.exam?c.exam.length:0),0);
      const color = meta.color || 'var(--red)';
      h += '<div class="book-head"><span class="b-dot" style="background:'+color+'"></span><b style="color:'+color+'">'+esc(bid)+'</b><span class="b-meta">'+list.length+' 章 · '+totalQa+' 考点</span></div>';
      list.forEach(c=>h+=chCard(c,color));
    });
  } else {
    CH.forEach(c=>h+=chCard(c));
  }
  $('#main').innerHTML = h;
  setTimeout(()=>{
    document.querySelectorAll('.ov-dt').forEach(d=>{
      const key = 'ovopen'+(d.dataset.ov?('_'+d.dataset.ov):'');
      d.open = !!store.get(key,false);
      d.addEventListener('toggle',e=>store.set(key,e.target.open));
    });
  },0);
}
function chCard(c,bcolor){
  const isFn = isFnPart(c.part);
  const noBg = bcolor || (isFn?'var(--blue)':'var(--red)');
  const qa = c.exam?c.exam.length:0;
  return '<div class="ch-card '+(isFn?'fn':'cn')+'" role="button" tabindex="0" onclick="gotoChapter(\''+c.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();gotoChapter(\''+c.id+'\')}">'+
    '<div class="head"><span class="no" style="background:'+noBg+'">'+esc(c.no)+'</span><span class="tt serif">'+esc(c.title.replace(/^第.章\s*/,''))+'</span>'+(qa?'<span class="qn-badge" style="border-color:'+noBg+';color:'+noBg+'">'+qa+' 考点</span>':'<span class="qn-badge zero">精读</span>')+'</div>'+
    '<div class="kw">'+taglineOf(c).split(' · ').map(k=>'<span>'+esc(k)+'</span>').join('')+'</div></div>';
}
function renderChapter(id){
  const c = partOf(id); if(!c) return renderChapters();
  current.ch = id;
  const prev = CH[CH.indexOf(c)-1], next = CH[CH.indexOf(c)+1];
  const backInfo = chStack.length? (chStack[chStack.length-1].t==='ch'?'上一章':'知识点') : '';
  const backBar = chStack.length? '<div class="backbar">← <b onclick="backChapter()">返回'+backInfo+'</b></div>' : '';
  let h = backBar + '<div class="crumbs"><b onclick="chStack.length=0;nav(\'chapters\')">目录</b> / '+esc(chName(c.id))+'</div>';
  h += '<div class="ch-title serif">'+esc(chName(c.id))+'</div>';
  h += '<div class="ch-sub">'+esc(taglineOf(c))+'</div>';
  h += secBlock('01 考纲对应考点',
    (c.exam&&c.exam.length?'<div class="sb-b"><div class="qa-hint">点击考点标签，查看标准答案与答题结构模板</div>'+c.exam.map((e,i)=>examHTML(e,i,id)).join('')+'</div>':'<div class="sb-b"><div class="qa-hint">本章为次要章节，无独立考点条目；按分段精读、易错点与备考要点复习即可。</div></div>'), true);
  h += secBlock('02 分段精读解析',
    '<div class="sb-b">'+c.sections.map(s=>'<p>'+(s[0]?'<b>'+esc(s[0])+'</b> ':'')+fmt(s[1])+'</p>').join('')+'</div>', true);
  h += secBlock('03 易错点与备考要点',
    '<div class="sb-b">'+
    (c.mistakes&&c.mistakes.length?'<div class="sb-sub">易错点</div>'+c.mistakes.map((m,i)=>'<div class="mis-item"><span class="num">'+(i+1)+'</span><span class="tx">'+fmt(m)+'</span></div>').join(''):'')+
    (c.tips&&c.tips.length?'<div class="sb-sub">备考要点</div>'+c.tips.map((t,i)=>'<div class="tips-box"><span class="num">'+(i+1)+'</span><span class="tx">'+fmt(t)+'</span></div>').join(''):'')+'</div>', true);
  if(c.summary){
    h += secBlock('04 知识总结（速查表）',
      '<div class="sb-b"><table class="sm"><colgroup>'+c.summary.headers.map((x,i)=>'<col style="width:'+(100/c.summary.headers.length)+'%">').join('')+'</colgroup><tr>'+
      c.summary.headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+
      c.summary.rows.map(r=>'<tr>'+r.map(td=>'<td>'+fmt(td)+'</td>').join('')+'</tr>').join('')+'</table></div>', true);
  }
  // 相关连接：本章作品 + 前后章
  const chWorks = WK.filter(w=>w.ch===id);
  const chTerms = TM.filter(t=>t.ch===id);
  h += '<div class="linkbar"><div class="lb-t">本章档案（人物 · 术语）</div>';
  chWorks.forEach(w=>h+='<span class="chip w" onclick="openWork(\''+w.id+'\')">'+esc(w.name)+'</span>');
  chTerms.forEach(t=>h+='<span class="chip" onclick="openTerm(\''+t.id+'\')">'+esc(t.name)+'</span>');
  h += '</div>';
  h += '<div class="linkbar"><div class="lb-t">章节连接</div>';
  if(prev) h+='<span class="chip" onclick="gotoChapter(\''+prev.id+'\')">← '+esc(chName(prev.id))+'</span>';
  if(next) h+='<span class="chip" onclick="gotoChapter(\''+next.id+'\')">'+esc(chName(next.id))+' ›</span>';
  h += '</div>';
  $('#main').innerHTML = h;
}
function secBlock(t, inner, open){
  return '<div class="sec-block'+(open?' open':'')+'">'+
    '<div class="sb-h">'+esc(t)+'<span class="arr">▼</span></div>'+inner+'</div>';
}
/* 考点热链：标签可点击 → QA 抽屉。层级词通配（含「考点N（自拟）」等考纲自定义），
   匹配到就按原文展示，避免层级词歧义时重复渲染「考点N」前缀 */
function examHTML(e, idx, chid){
  const m = e.match(/^(考点\d+)（([^）]+)）：(.*)$/s);
  const label = m? m[1]+'（'+m[2]+'）' : ('考点'+(idx+1));
  const body = m? m[3] : e;
  const isFn = isFnPart((partOf(chid)||{}).part);
  return '<div class="exam-item" onclick="openQA(\''+chid+'\','+idx+')"><div class="exam-head"><span class="exam-link'+(isFn?' fn-side':'')+'">'+esc(label)+'</span><span class="exam-arr">答题 ›</span></div>'+
    '<div class="exam-body">'+applyRuby(esc(body))+'</div></div>';
}

/* ===== 背诵闪卡 · 复习调度 ===== */
CD.forEach((c,i)=>{ if(!c.id) c.id='cd'+i; }); // id 缺失时兜底生成（build.py 已注入则尊重数据 id）
const DAY = 86400000;
const cardState = store.get('cardstate',{});
// 调度状态归一化：兼容旧版字符串值（'known'/'again'）
function srsOf(id){
  const v = cardState[id];
  if(!v) return {st:null, reps:0, ivl:0, ease:2.5, next:0};
  if(typeof v === 'string') return {st:v, reps:0, ivl:0, ease:2.5, next:0};
  return {st:v.st||null, reps:v.reps||0, ivl:v.ivl||0, ease:Math.max(1.3,+(v.ease||2.5)), next:v.next||0};
}
function srsSet(id,s){
  cardState[id] = {st:s.st, reps:s.reps, ivl:s.ivl, ease:Math.round(s.ease*100)/100, next:s.next};
  store.set('cardstate',cardState);
}
function fmtDue(t){
  if(!t) return '未排期';
  const diff = t - Date.now();
  if(diff<=0) return '今天到期';
  const d = Math.round(diff/DAY);
  return d===1 ? '明天' : d+' 天后';
}
const RLAB = {all:'全部',new:'未学',weak:'需巩固'};
function statsOf(){
  const now = Date.now();
  const total = CD.length;
  let known=0, weak=0, due=0;
  CD.forEach(c=>{
    const s = srsOf(c.id);
    if(s.st==='known') known++;
    else if(s.st==='again') weak++;
    if(s.next && s.next<=now) due++;
  });
  return {total, known, weak, due, fresh: total-known-weak};
}
function renderStats(){
  const s = statsOf();
  const el = $('#stats');
  if(el) el.innerHTML = '已掌握 <b style="color:var(--ok)">'+s.known+'</b> · 今日到期 <b style="color:var(--red)">'+s.due+'</b> · 需巩固 <b style="color:var(--warn)">'+s.weak+'</b> · 未学 '+s.fresh+' / '+s.total;
}
function saveProg(){
  const graded = {};
  (current.rq||[]).forEach(c=>{ if(c._graded) graded[c.id] = {p:c._prevSrs, ok:c._lastOk}; });
  store.set('recite',{filter:current.reciteFilter, idx:current.ri, right:current.right, order:current.rq.map(c=>c.id), wrong:(current.rq||[]).filter(x=>x._again).map(x=>x.id), graded});
}
function renderRecite(){
  const filter = current.reciteFilter;
  const s = statsOf();
  $('#main').innerHTML =
    '<div class="sec-title cn">背诵闪卡</div>'+
    '<div class="progress" id="stats"></div>'+
    '<div class="recite-toolbar">'+
    Object.keys(RLAB).map(f=>'<button class="rbtn'+(filter===f?' on':'')+'" onclick="setRFilter(\''+f+'\')">'+RLAB[f]+'</button>').join('')+
    '<button class="rbtn" onclick="resetProgress()">清空进度</button></div>'+
    '<div id="rarea"></div>';
  renderStats();
  startRecite();
}
function setRFilter(f){ current.reciteFilter=f; renderRecite(); }
function buildPool(f){
  const now = Date.now();
  let p = CD.slice();
  if(f==='new') p = p.filter(c=>!srsOf(c.id).st);
  else if(f==='weak') p = p.filter(c=>srsOf(c.id).st==='again');
  // all 分支无需按 rk 排序：到期置顶由 shufPool 统一处理，此处仅返回全集
  return p;
}
/* 到期卡置顶 + 组内洗牌（all 模式下不被 shuffle 打乱置顶顺序） */
function shufPool(pool){
  const now = Date.now();
  const due = [], rest = [];
  pool.forEach(c=>{ const s=srsOf(c.id); ((s.next&&s.next<=now)?due:rest).push(c); });
  shuffle(due); shuffle(rest);
  return due.concat(rest);
}
function startRecite(){
  const filter = current.reciteFilter;
  const pool = buildPool(filter);
  const total = pool.length;
  const prog = store.get('recite',null);
  if(prog && prog.filter===filter && prog.idx>=0 && prog.idx<=total && prog.order && prog.order.length===total){
    // 按上次顺序重建题库，防「串题」（答 N 题退出重进后顺序/题号错位）
    current.rq = prog.order.map(id=>CD.find(c=>c.id===id)).filter(Boolean);
    if(current.rq.length!==total){ current.rq = shufPool(pool); }
    current.ri = prog.idx;
    current.right = prog.right||0;
    if(prog.wrong && prog.wrong.length) current.rq.forEach(c=>{ c._again = prog.wrong.includes(c.id); });
    // 还原已评分标记（刷新后同轮回看再评仍按回滚逻辑，不双重推进）；到期与否由 markCard 统一判定
    if(prog.graded) current.rq.forEach(c=>{ const g=prog.graded[c.id]; if(g){ c._graded=true; c._prevSrs=g.p; c._lastOk=g.ok; } });
  } else {
    current.rq = shufPool(pool); current.ri = 0;
    current.right = 0;
  }
  saveProg();
  showCard();
  // 搜索「闪卡」结果跳转定位：hashchange 可能触发第二次 renderRecite→startRecite（重新洗牌），
  // 因此定位块在每次 startRecite 末尾都执行（幂等），__gotoFlash 由 go 的 setTimeout 统一清除
  if(window.__gotoFlash){
    const gi = current.rq.findIndex(x=>x.id===window.__gotoFlash);
    if(gi>=0){ current.ri=gi; saveProg(); showCard(); }
  }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function showCard(){
  const qs = current.rq;
  const total = qs.length;
  const i = current.ri;
  const wrap = $('#rarea');
  const s = statsOf();
  const bar = '<div class="progress">'+(i>0?'<button class="prev" onclick="prevCard()">← 上一题</button>':'')+'第 '+Math.min(i+1,total)+' / '+total+' 题 · 本轮答对 '+current.right+'<div class="bar"><i style="width:'+(total?Math.round(i/total*100):0)+'%"></i></div></div>';
  if(!total){
    wrap.innerHTML = '<div class="recite-end"><div class="big">'+s.known+'</div><div class="txt">'+({new:'没有未学的卡片了',weak:'没有需要巩固的卡片了',due:'今天没有到期的卡片'}[current.reciteFilter]||'当前范围没有卡片')+' · 已掌握 '+s.known+' / '+s.total+' 题</div>'+
      '<div class="recite-btns"><button class="b-known" onclick="setRFilter(\'all\')">切到全部</button></div></div>';
    return;
  }
  if(i>=total){
    const wrong = current.rq.filter(x=>x._again);
    wrap.innerHTML = bar + '<div class="recite-end"><div class="big">'+total+'</div><div class="txt">本轮完成 · 答对 '+current.right+' / '+total+' 题<br>累计已掌握 '+s.known+' / '+s.total+' 题'+(wrong.length?'<br>本轮 '+wrong.length+' 题没记住，已重置为 1 天后复习':'')+'</div>'+
      (wrong.length?'<div class="recite-btns"><button class="b-again" onclick="replayWrong()">重练本轮错题（'+wrong.length+'）</button></div>':'')+
      '<div style="margin-top:10px" class="recite-btns"><button class="b-known" onclick="setRFilter(\'weak\')">复习全部巩固题</button><button class="b-known" onclick="startRecite()">再来一轮</button></div></div>';
    return;
  }
  const c = qs[i];
  const pc = partOf(c.ch);
  const isFn = isFnPart(pc.part);
  const st = srsOf(c.id);
  const stTag = st.st==='known'?'<span class="fc-st known">已掌握</span>':(st.st==='again'?'<span class="fc-st again">需巩固</span>':'<span></span>');
  const now = Date.now();
  let sched;
  if(st.next && st.next<=now) sched = '<div class="fc-sched"><b style="color:var(--red)">今日到期</b> · 间隔 '+st.ivl+' 天 · 难度 '+st.ease.toFixed(2)+'</div>';
  else if(st.reps) sched = '<div class="fc-sched">'+fmtDue(st.next)+' · 间隔 '+st.ivl+' 天 · 难度 '+st.ease.toFixed(2)+'</div>';
  else sched = '<div class="fc-sched">新卡 · 记住后 1 天复查</div>';
  wrap.innerHTML = bar +
    '<div class="fc-row"><span class="fc-tag '+(isFn?'fn':'cn')+'">'+esc(chName(pc.id))+'</span>'+stTag+'</div>'+
    '<div class="card-wrap"><div class="flashcard" id="fc" onclick="flipCard()">'+
      '<div class="face"><div class="fc-q">'+esc(c.q)+'</div><div class="fc-tip" onclick="event.stopPropagation();flipCard()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg><span>看答案</span></div></div>'+
      '<div class="back" onclick="event.stopPropagation()"><div class="fc-a">'+fmt(c.a)+'</div><div class="back-btns"><button class="b-known" onclick="event.stopPropagation();markCard(1)">记住了</button><button class="b-again" onclick="event.stopPropagation();markCard(0)">没记住</button></div></div>'+
    '</div></div>'+
    sched;
}
function flipCard(){ $('#fc').classList.toggle('flip'); }
function prevCard(){ if(current.ri>0){ current.ri--; saveProg(); showCard(); } }
function markCard(ok){
  const c = current.rq[current.ri];
  let st = srsOf(c.id);
  if(c._graded && !(st.next && st.next<=Date.now())){
    // 回看后重评（卡未到期）：先撤销上次评分（调度与计数回滚），再按新评分写入。
    // 到期卡属于新的复习周期，走新评分路径，避免跨会话到期重考被误判为回看覆盖（间隔永远不增长）
    if(c._lastOk) current.right = Math.max(0, current.right-1);
    srsSet(c.id, c._prevSrs);
    st = srsOf(c.id);
  } else {
    c._prevSrs = {st:st.st, reps:st.reps, ivl:st.ivl, ease:st.ease, next:st.next};
    c._graded = true;
  }
  c._lastOk = !!ok;
  c._again = !ok;
  if(ok){
    current.right++;
    st.reps += 1;
    if(st.reps===1) st.ivl = 1;
    else if(st.reps===2) st.ivl = 6;
    else st.ivl = Math.max(1, Math.round(st.ivl * st.ease));
    st.ease = Math.max(1.3, st.ease + 0.1);
    st.st = 'known';
  } else {
    st.reps = 0;
    st.ivl = 1;
    st.ease = Math.max(1.3, st.ease - 0.2);
    st.st = 'again';
  }
  st.next = Date.now() + st.ivl*DAY;
  srsSet(c.id, st);
  current.ri++; // 无条件自增：答完最后一张后 ri===rq.length，showCard 自然进入完成分支；idx===total 由 startRecite 恢复逻辑承接
  saveProg();
  renderStats();
  showCard();
}
function replayWrong(){
  current.rq = current.rq.filter(x=>x._again).map(x=>({...x,_again:false}));
  current.ri = 0; current.right = 0;
  saveProg();
  showCard();
}

function openWork(id){
  if(!WKIDX[id]) return;
  if($('#drawer').classList.contains('open')) dstack.push({t:'w',id});
  else { dstack.length=0; dstack.push({t:'w',id}); }
  showDrawer();
}
function openTerm(id){
  if(!TMIDX[id]) return;
  if($('#drawer').classList.contains('open')) dstack.push({t:'t',id});
  else { dstack.length=0; dstack.push({t:'t',id}); }
  showDrawer();
}

function openQA(chid, idx){
  try{
    if(!QA[chid] || !QA[chid][idx]) return;
    if($('#drawer').classList.contains('open')) dstack.push({t:'q',ch:chid,i:idx});
    else { dstack.length=0; dstack.push({t:'q',ch:chid,i:idx}); }
    showDrawer();
  }catch(err){
    $('#drsheet').innerHTML = '<div style="padding:20px">QA ERROR: '+esc(err.message)+'</div>';
    $('#drawer').classList.add('open');
  }

function showDrawer(){
  const top = dstack[dstack.length-1];
  const back = dstack.length>1
    ? '<div class="backbar">← <b onclick="closeDrawer()">返回上一知识点</b></div>'
    : '<div class="backbar">← <b onclick="closeDrawer()">关闭</b></div>';
  if(top.t==='w') renderWork(top.id, back);
  else if(top.t==='t') renderTerm(top.id, back);
  else renderQA(top.ch, top.i, back);
  $('#drawer').classList.add('open');
}

/* ===== 搜索 ===== */
function doSearch(){
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#qres');
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const res = [];
  WK.forEach(w=>{ if(w.name.toLowerCase().includes(q) || w.tags.some(t=>t.toLowerCase().includes(q))) res.push({k:'人物',t:w.name,go:()=>openWork(w.id)}); });
  TM.forEach(t=>{ if((t.name||'').toLowerCase().includes(q) || (t.def||'').toLowerCase().includes(q)) res.push({k:'概念',t:t.name,go:()=>openTerm(t.id)}); });
  CH.forEach(c=>{ if((c.title||'').includes(q) || (c.exam||[]).join('').includes(q)) res.push({k:'章节',t:chName(c.id),go:()=>{closeSearch();gotoChapter(c.id);}}); });
  // 别名可搜：LINK_DICT 含词典别名（ALIAS），命中后跳主条目（同名本名已在上方命中时跳过）
  LINK_DICT.forEach(a=>{
    if(!a.name || !a.name.toLowerCase().includes(q)) return;
    if(a.type==='w'){ const w=WK.find(x=>x.id===a.id); if(w && !res.some(r=>r.k==='人物'&&r.t===w.name)) res.push({k:'人物',t:w.name,go:()=>openWork(a.id)}); }
    else if(a.type==='t'){ const t=TM.find(x=>x.id===a.id); if(t && !res.some(r=>r.k==='概念'&&r.t===t.name)) res.push({k:'概念',t:t.name,go:()=>openTerm(a.id)}); }
  });
  CD.forEach(cd=>{ if((cd.q||'').toLowerCase().includes(q)) res.push({k:'闪卡',t:cd.q.slice(0,26)+'…',go:()=>{closeSearch();current.reciteFilter='all';window.__gotoFlash=cd.id;location.hash='#recite';renderRecite();setTimeout(()=>{const i=current.rq.findIndex(x=>x.id===window.__gotoFlash);if(i>=0){current.ri=i;saveProg();showCard();}window.__gotoFlash=null;},60);}}); });
  // 结果项通过 searchGo(i) 索引委托调用，避免内联 onclick 引用闭包变量失效
  window.__sres = res.slice(0,12);
  box.innerHTML = window.__sres.map((r,i)=>'<div class="it" onclick="searchGo('+i+')"><span class="k">'+r.k+'</span>'+esc(r.t)+'</div>').join('') || '<div class="it" style="color:var(--ink2)">无匹配结果</div>';
  box.classList.add('open');
}
function searchGo(i){ const r = window.__sres && window.__sres[i]; if(r) r.go(); }
function closeSearch(){ const b=$('#qres'); if(b){b.classList.remove('open');b.innerHTML='';} }

  var t = e.target;
  if(!t || !t.closest) return;
  if(t.closest('.drawer') || t.closest('.searchwrap') || t.closest('.bottom-nav') || t.closest('.exam-item') || t.closest('.ilink') || t.closest('.chip')) return;
  var h = t.closest('.sb-h');
  if(h) h.parentElement.classList.toggle('open');
});
$('#drmask').addEventListener('click', closeDrawer);
/* 抽屉下滑关闭（移动端触摸）：内容在顶部时下拉跟随，松手超阈值关闭；中部滚动不误关；小拖动回弹；桌面不受影响 */
(function(){
  var sheet=$('#drsheet'), st=null, TH=160;
  sheet.addEventListener('touchstart', function(e){
    if(sheet.scrollTop>0){ st=null; return; }
    st={y:e.touches[0].clientY, dy:0, moved:false};
  }, {passive:true});
  sheet.addEventListener('touchmove', function(e){
    if(!st) return;
    var dy=e.touches[0].clientY-st.y;
    if(dy<=0){ if(st.dy>0){ st.dy=0; sheet.style.transition=''; sheet.style.transform=''; } return; }
    if(dy>8) st.moved=true;
    st.dy=dy;
    sheet.style.transition='none';
    sheet.style.transform='translateY('+Math.min(dy,TH)+'px)';
    e.preventDefault();
  }, {passive:false});
  sheet.addEventListener('touchend', function(){
    if(!st) return;
    var dy=st.dy, moved=st.moved; st=null;
    sheet.style.transition=''; sheet.style.transform='';
    if(moved && dy>TH) closeDrawer();
  });
})();
window.addEventListener('hashchange', router);
router();
</script>
</body>
