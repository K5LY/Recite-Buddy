<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}·分章背诵助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23{{C1HEX}}'/%3E%3Cpath d='M8 22V10l4 6 4-6v12' stroke='%23F7F6F1' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="{{APPICON}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{APPTITLE}}">
<style>
:root{
  --paper:#F6F4EE; --paper2:#EDEAE1; --ink:#23272B; --ink2:#5A5A55;
  --line:#DFDBD0; --red:{{C1}}; --blue:{{C2}}; --redbg:#E9EFEB; --bluebg:#F4EDE1;
  --ok:#3E7C4F; --warn:#A8762E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.65;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit}

/* ===== 顶部 ===== */
header{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 14px 8px;position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand .t{font-size:17px;font-weight:700;letter-spacing:.5px}
.brand .s{font-size:11px;color:var(--ink2)}
.searchwrap{position:relative}
.searchwrap input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;font-size:16px;outline:none}
.searchwrap input:focus{border-color:var(--red)}
.searchres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.08);max-height:320px;overflow:auto;z-index:50;display:none}
.searchres.open{display:block}
.searchres .it{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.searchres .it:last-child{border-bottom:none}
.searchres .it .k{color:var(--red);font-size:11px;margin-right:6px}
.searchres .it:active{background:var(--paper2)}

/* ===== 主区 ===== */
main{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px calc(76px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.view{display:none}
.view.active{display:block}

/* 章节列表 */
.sec-title{font-size:13px;color:var(--ink2);margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:4px;height:14px;border-radius:2px}
.sec-title.cn::before{background:var(--red)}
.sec-title.fn::before{background:var(--blue)}
.ch-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer;display:block;width:100%;text-align:left;padding:0}
.ch-card .head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.ch-card .no{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px;flex:0 0 auto}
.ch-card.cn .no{background:var(--red)}
.ch-card.fn .no{background:var(--blue)}
.ch-card .tt{font-size:16px;font-weight:700}
.ch-card .kw{display:flex;flex-wrap:wrap;gap:6px;padding:2px 14px 10px}
.ch-card .kw span{font-size:12px;color:var(--ink2);background:var(--paper2);border-radius:20px;padding:2px 9px}
.ch-card:active{background:var(--paper2)}

/* 章详情 */
.crumbs{font-size:13px;color:var(--ink2);margin-bottom:10px}
.crumbs b{cursor:pointer;color:var(--red)}
.ch-title{font-size:21px;font-weight:700;margin:0 0 2px}
.ch-sub{font-size:13px;color:var(--ink2);margin-bottom:12px}
.sec-block{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sec-block .sb-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer;user-select:none}
.sec-block .sb-h .arr{margin-left:auto;color:var(--ink2);font-size:12px;transition:transform .18s}
.sec-block.open .sb-h .arr{transform:rotate(180deg)}
.sec-block .sb-b{display:none;padding:2px 14px 12px;border-top:1px solid var(--line)}
.sec-block.open .sb-b{display:block}
.sec-block .sb-b p{margin:9px 0;font-size:15px;text-align:justify}
.sec-block .sb-b p b{color:var(--red)}
.exam-item{margin:9px 0;font-size:15px}
.exam-item b{color:var(--red)}
.mis-item{margin:8px 0;font-size:14.5px;color:#4A3A2A;background:var(--redbg);border-radius:8px;padding:8px 10px}
.tips-box{margin:9px 0;font-size:14.5px;background:var(--bluebg);border-radius:8px;padding:8px 10px;color:#24404C}
table.sm{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;margin-top:6px}
table.sm th{background:var(--paper2);border:1px solid var(--line);padding:6px 5px;text-align:center;font-weight:700}
table.sm td{border:1px solid var(--line);padding:6px 5px;vertical-align:top}
table.sm td:first-child{text-align:center;font-weight:600;color:var(--red)}
.linkbar{margin-top:12px}
.linkbar .lb-t{font-size:13px;color:var(--ink2);margin-bottom:6px}
.chip{display:inline-block;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:0 6px 6px 0;cursor:pointer;color:var(--ink)}
.chip:active{background:var(--paper2)}
.chip.w{background:var(--bluebg);border-color:#BFD4DE;color:#24404C}

/* 闪卡 */
.recite-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.rbtn{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px}
.rbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card-wrap{perspective:1200px;margin:6px 0 10px}
.flashcard{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px 20px;text-align:center;position:relative;transform-style:preserve-3d;transition:transform .3s;cursor:pointer}
.flashcard.flip{transform:rotateY(180deg)}
.flashcard .face{backface-visibility:hidden;width:100%}
.flashcard .back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;padding:24px 20px;overflow-y:auto;backface-visibility:hidden}
.fc-tag{position:absolute;top:12px;left:14px;font-size:11px;color:#fff;border-radius:6px;padding:2px 8px}
.fc-tag.cn{background:var(--red)} .fc-tag.fn{background:var(--blue)}
.fc-q{font-size:17px;font-weight:700;line-height:1.6}
.fc-hint{font-size:12px;color:var(--ink2);margin-top:14px}
.fc-a{font-size:15.5px;text-align:left;line-height:1.7}
.recite-btns{display:flex;gap:10px}
.recite-btns button{flex:1;border-radius:12px;padding:12px 0;font-size:15px;font-weight:700;color:#fff}
.b-known{background:var(--ok)} .b-again{background:var(--warn)}
.progress{font-size:13px;color:var(--ink2);text-align:center;margin-bottom:8px}
.progress .bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
.recite-end{text-align:center;padding:30px 10px}
.recite-end .big{font-size:44px;font-weight:800;color:var(--red)}
.recite-end .txt{font-size:15px;color:var(--ink2);margin:10px 0 16px}

/* 线索 */
.thread-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.thread-card .th-h{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.thread-card .th-h .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:0 0 auto}
.thread-card.fn .th-h .dot{background:var(--blue)}
.thread-card .th-h .arr{margin-left:auto;color:var(--ink2);font-size:12px;transition:transform .18s}
.thread-card.open .th-h .arr{transform:rotate(180deg)}
.thread-card .th-h .tt{font-size:15px;font-weight:700}
.thread-card .th-desc{font-size:13px;color:var(--ink2);padding:0 14px 10px;display:none}
.thread-card.open .th-desc{display:block}
.thread-card .th-body{display:none;padding:0 14px 12px}
.thread-card.open .th-body{display:block}
.tnode{border-left:2px solid var(--line);margin:0 0 0 5px;padding:0 0 12px 14px;position:relative}
.tnode::before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.thread-card.fn .tnode::before{background:var(--blue)}
.tnode:last-child{border-left-color:transparent}
.tnode .nt{font-size:15px;font-weight:700;cursor:pointer}
.tnode .nt:active{color:var(--red)}
.tnode .nd{font-size:13.5px;color:var(--ink2);margin-top:2px}
.tnode .nl{margin-top:6px}

/* 档案库 */
.wfilter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.wcard:active{background:var(--paper2)}
.wcard .wt{font-size:15.5px;font-weight:700}
.wcard .wm{font-size:12.5px;color:var(--ink2);margin-top:2px}
.wcard .wtg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.wcard .wtg span{font-size:11px;color:var(--ink2);background:var(--paper2);border-radius:20px;padding:1px 8px}

/* 抽屉（作品详情） */
.drawer{position:fixed;left:0;right:0;bottom:0;top:0;z-index:100;pointer-events:none}
.drawer .mask{position:absolute;inset:0;background:rgba(20,22,24,.4);opacity:0;transition:opacity .2s}
.drawer .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;max-height:82dvh;overflow-y:auto;transform:translateY(102%);transition:transform .22s;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
.drawer.open{pointer-events:auto}
.drawer.open .mask{opacity:1}
.drawer.open .sheet{transform:translateY(0)}
.grip{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.dw-name{font-size:20px;font-weight:800}
.dw-meta{font-size:13px;color:var(--ink2);margin:4px 0 12px}
.dw-row{margin:10px 0}
.dw-row .lb{font-size:12px;color:var(--ink2);margin-bottom:3px}
.dw-row .val{font-size:15px;background:#fff;border-radius:10px;padding:9px 12px;border:1px solid var(--line)}
.dw-row .val b{color:var(--red)}
.dw-img{margin:10px 0 2px;text-align:center}
.dw-img img{max-width:100%;max-height:250px;border-radius:10px;display:block;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.16);cursor:zoom-in;transition:max-height .25s ease;background:#fff}
.dw-img img.big{max-height:76dvh;cursor:zoom-out}
.dw-img-cap{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.5}
.term-th{display:inline-block;width:92px;margin:5px 6px 5px 0;vertical-align:top;text-align:center;cursor:pointer}
.term-th img{width:92px;height:70px;object-fit:cover;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.14);background:#fff}
.term-th span{display:block;font-size:11px;color:var(--ink1);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 底部导航 */
nav{flex:0 0 auto;position:fixed;left:0;right:0;bottom:0;background:rgba(247,246,241,.97);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
nav .tab{flex:1;text-align:center;padding:9px 0 8px;color:var(--ink2);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav .tab .ic{width:22px;height:22px}
nav .tab.on{color:var(--red);font-weight:700}
nav .tab.fn-side.on{color:var(--blue)}

.empty{text-align:center;color:var(--ink2);font-size:14px;padding:30px 10px}

/* 知识内链与返回 */
.ilink{color:var(--red);text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(178,58,47,.35);font-weight:600}
.ilink:active{background:var(--redbg);border-radius:3px}
.backbar{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);margin:0 0 10px;flex-wrap:wrap}
.backbar b{color:var(--red);cursor:pointer;font-weight:600;padding:2px 4px}
.backbar b:active{background:var(--redbg);border-radius:4px}
.term-def{font-size:15px;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}

/* 考点热链与 QA 抽屉 */
.qa-hint{font-size:12.5px;color:var(--ink2);background:var(--bluebg);border-radius:8px;padding:6px 10px;margin:8px 0 4px}
.exam-item{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.exam-link{flex:0 0 auto;color:#fff;background:var(--red);border-radius:6px;padding:2px 10px;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none}
.exam-link:active{opacity:.8}
.exam-link.fn-side{background:var(--blue)}
.exam-body{flex:1 1 0;min-width:200px}
.qa-head{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.qa-level{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:3px 9px}
.qa-level.cn{background:var(--red)} .qa-level.fn{background:var(--blue)}
.qa-q{font-size:14.5px;color:#3A3A35;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:4px 0 2px}
.qa-list,.qa-tpl{margin:0;padding-left:20px;font-size:14.5px}
.qa-list li,.qa-tpl li{margin:8px 0}
.qa-tpl{list-style:none;counter-reset:qa}
.qa-tpl li{counter-increment:qa;position:relative}
.qa-tpl li::before{content:counter(qa,decimal-leading-zero);position:absolute;left:-26px;top:1px;font-size:11px;font-weight:700;color:var(--red);background:var(--redbg);border-radius:4px;padding:0 5px}
.qa-goto{margin-top:14px;text-align:center;font-size:15px;font-weight:700;color:var(--red);cursor:pointer;background:#fff;border:1px solid var(--red);border-radius:12px;padding:11px 0}
ruby{ruby-align:center}
rt{font-size:.52em;color:#8A857A;font-weight:400}

@media (min-width:900px){
  main{max-width:760px;margin:0 auto}
  header{max-width:760px;margin:0 auto;left:0;right:0}
  nav{max-width:760px;left:50%;transform:translateX(-50%)}
}




/* ===== iOS standalone 终极修复：body 锚定视口，不依赖 vh/dvh ===== */
body{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column}
/* ===== iOS 主屏幕全屏适配 v2：约束滚动容器在视口内 ===== */
html{height:100%}
body{height:100%;height:100vh;height:100dvh}
main{flex:1 1 auto;min-height:0;overflow-y:auto}
main{padding-bottom:88px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* ===== iOS 主屏幕全屏适配 ===== */
body{height:100vh;height:100dvh}
header{padding-top:calc(10px + env(safe-area-inset-top))}
main{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
nav{padding-bottom:constant(safe-area-inset-bottom);padding-bottom:env(safe-area-inset-bottom)}

/* ===== v5 最终：document 原生滚动（standalone 兼容，无内部滚动容器） ===== */
body{position:static;height:auto;overflow:visible;display:block;min-height:0}
header{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:calc(10px + env(safe-area-inset-top))}
main{padding-top:calc(94px + env(safe-area-inset-top));padding-bottom:calc(100px + env(safe-area-inset-bottom));overflow:visible;flex:none}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="t serif">{{TITLE}}</span><span class="s">{{BADGE}}</span></div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="搜索人物 / 术语 / 展览" autocomplete="off">
    <div class="searchres" id="qres"></div>
  </div>
</header>

<main id="main"></main>

<nav>
  <button class="tab" data-view="chapters" onclick="nav('chapters')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>章节</button>
  <button class="tab" data-view="recite" onclick="nav('recite')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/><path d="M6 14h4"/></svg>背诵</button>
  <button class="tab" data-view="threads" onclick="nav('threads')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v6M12 13l-5.2 4.2M12 13l5.2 4.2"/></svg>连接</button>
  <button class="tab" data-view="works" onclick="nav('works')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>{{TAB4}}</button>
</nav>

<!-- 作品详情抽屉 -->
<div class="drawer" id="drawer">
  <div class="mask" id="drmask"></div>
  <div class="sheet" id="drsheet"></div>
</div>

<script>
/* ===== 数据注入占位 ===== */
const CH = {{CH}};
const WK = {{WK}};
const CD = {{CD}};
const TH = {{TH}};
const TM = {{TM}};
const QA = {{QA}};
const PY = {{PY}};
/* ===== 工具 ===== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const partOf = ch => CH.find(c=>c.id===ch);
const chName = ch => {const c=partOf(ch); return c? c.no.replace(/^第/,'').replace(/章$/,'')+'·'+c.title.replace(/^第.章\s*/,''):'';};
const WKIDX = {}; WK.forEach(w=>WKIDX[w.id]=w);
const TMIDX = {}; TM.forEach(t=>TMIDX[t.id]=t);
/* 知识内链词典：作品名 + 自动链接术语，长词优先 */
const LINK_DICT = [];
WK.forEach(w=>{ if(w.name.length>=2) LINK_DICT.push({name:w.name,type:'w',id:w.id}); });
TM.forEach(t=>{ if(t.auto && t.name.length>=2) LINK_DICT.push({name:t.name,type:'t',id:t.id}); });
// 别名：人物简称、机构简称与展览别称，补充进词典（长词优先，避免误链）
const ALIAS = {{ALIAS}};
ALIAS.forEach(a=>LINK_DICT.push({name:a[0],type:a[1],id:a[2]}));
LINK_DICT.sort((a,b)=>b.name.length-a.name.length);
function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function linkify(txt){
  if(!txt) return '';
  const s = esc(txt);
  const ranges = [];
  for(const e of LINK_DICT){
    const re = new RegExp('(?<![A-Za-z0-9])'+escReg(e.name)+'(?![A-Za-z0-9])','g');
    let m;
    while((m=re.exec(s))){
      const st=m.index, en=m.index+e.name.length;
      if(ranges.some(r=>st<r.en&&en>r.st)) continue;
      ranges.push({st,en,name:e.name,type:e.type,id:e.id});
    }
  }
  if(!ranges.length) return s;
  ranges.sort((a,b)=>a.st-b.st);
  let out='', pos=0;
  for(const r of ranges){
    out += s.slice(pos,r.st);
    out += '<a class="ilink" onclick="linkGo('+(r.type==='w'?'openWork':'openTerm')+',\''+r.id+'\',event)">'+r.name+'</a>';
    pos = r.en;
  }
  return out + s.slice(pos);
}
function linkGo(fn,id,e){ if(e&&e.stopPropagation) e.stopPropagation(); fn(id); }
/* 生僻字注音：仅标真正生僻的字词（数据已在 py_data.json 精简） */
function applyRuby(txt){
  if(!txt) return txt;
  const py = PY.py, kw = PY.kw;
  let t = String(txt);
  for(const k in kw){ t = t.split(k).join('\x01'+k+'\x02'+kw[k]+'\x03'); }
  const buf = []; let i = 0;
  while(i < t.length){
    if(t[i]==='\x01'){
      const j = t.indexOf('\x03', i);
      if(j===-1){ buf.push(t[i]); i++; continue; }
      buf.push(t.slice(i, j+1)); i = j+1;
    } else {
      const ch = t[i];
      if(py[ch]) buf.push('\x01'+ch+'\x02'+py[ch]+'\x03');
      else buf.push(ch);
      i++;
    }
  }
  return buf.join('').replace(/\x01([^\x02]+)\x02([^\x03]+)\x03/g, '<ruby>$1<rt>$2</rt></ruby>');
}

const chStack = []; // 章节返回栈：{t:'ch',id} 或 {t:'d',id,k}
function gotoChapter(id){
  if(location.hash.startsWith('#chapter/')) chStack.push({t:'ch', id:current.ch});
  if($('#drawer').classList.contains('open')){
    const top = dstack[dstack.length-1];
    if(top){
      if(top.t==='q') chStack.push({t:'d', k:'q', ch:top.ch, i:top.i});
      else chStack.push({t:'d', id:top.id, k:top.t, ch:current.ch});
    }
    dstack.length = 0;
    $('#drawer').classList.remove('open');
  }
  nav('chapter/'+id);
}
function backChapter(){
  const e = chStack.pop(); if(!e) return;
  if(e.t==='ch') nav('chapter/'+e.id);
  else {
    const chid = e.ch || (current.ch && location.hash.startsWith('#chapter/') ? current.ch : null);
    if(chid) nav('chapter/'+chid);
    else if(current.ch && location.hash.startsWith('#chapter/')) renderChapter(current.ch);
    if(e.k==='q') openQA(e.ch, e.i);
    else if(e.k==='w') openWork(e.id);
    else openTerm(e.id);
  }
}

/* ===== 背诵闪卡 ===== */
CD.forEach((c,i)=>{ c.id='cd'+i; });
const cardState = store.get('cardstate',{});
const RLAB = {all:'全部',new:'未学',weak:'需巩固'};
function statsOf(){
  const total = CD.length;
  let known=0, weak=0;
  CD.forEach(c=>{ if(cardState[c.id]==='known') known++; else if(cardState[c.id]==='again') weak++; });
  return {total, known, weak, fresh: total-known-weak};
}
function renderStats(){
  const s = statsOf();
  const el = $('#stats');
  if(el) el.innerHTML = '已掌握 <b style="color:var(--ok)">'+s.known+'</b> · 需巩固 <b style="color:var(--warn)">'+s.weak+'</b> · 未学 '+s.fresh+' / '+s.total;
}
function saveProg(){
  store.set('recite',{filter:current.reciteFilter, idx:current.ri});
}
function renderRecite(){
  const filter = current.reciteFilter;
  $('#main').innerHTML =
    '<div class="sec-title cn">背诵闪卡 · 点击卡片看答案</div>'+
    '<div class="progress" id="stats"></div>'+
    '<div class="recite-toolbar">'+
    Object.keys(RLAB).map(f=>'<button class="rbtn'+(filter===f?' on':'')+'" onclick="setRFilter(\''+f+'\')">'+RLAB[f]+'</button>').join('')+
    '<button class="rbtn" onclick="startRecite()">继续/重开</button>'+
    '<button class="rbtn" onclick="resetProgress()">清空进度</button></div>'+
    '<div id="rarea"></div>';
  renderStats();
  startRecite();
}
function setRFilter(f){ current.reciteFilter=f; renderRecite(); }
function buildPool(f){
  let p = CD.slice();
  if(f==='new') p = p.filter(c=>!cardState[c.id]);
  else if(f==='weak') p = p.filter(c=>cardState[c.id]==='again');
  else { const rk=c=>!cardState[c.id]?0:(cardState[c.id]==='again'?1:2); p.sort((a,b)=>rk(a)-rk(b)); }
  return p;
}
function startRecite(){
  const filter = current.reciteFilter;
  const pool = buildPool(filter);
  const total = pool.length;
  const prog = store.get('recite',null);
  if(prog && prog.filter===filter && prog.idx>0 && prog.idx<total){
    current.rq = pool; current.ri = prog.idx;
  } else {
    shuffle(pool); current.rq = pool; current.ri = 0;
  }
  current.right = 0;
  saveProg();
  showCard();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function showCard(){
  const qs = current.rq;
  const total = qs.length;
  const i = current.ri;
  const wrap = $('#rarea');
  const s = statsOf();
  const bar = '<div class="progress">第 '+Math.min(i+1,total)+' / '+total+' 题 · 本轮答对 '+current.right+'<div class="bar"><i style="width:'+(total?Math.round(i/total*100):0)+'%"></i></div></div>';
  if(!total){
    wrap.innerHTML = '<div class="recite-end"><div class="big">'+s.known+'</div><div class="txt">'+({new:'没有未学的卡片了',weak:'没有需要巩固的卡片了'}[current.reciteFilter]||'当前范围没有卡片')+' · 已掌握 '+s.known+' / '+s.total+' 题</div>'+
      '<div class="recite-btns"><button class="b-known" onclick="setRFilter(\'all\')">切到全部</button></div></div>';
    return;
  }
  if(i>=total){
    const wrong = current.rq.filter(x=>x._again);
    wrap.innerHTML = bar + '<div class="recite-end"><div class="big">'+total+'</div><div class="txt">本轮完成 · 答对 '+current.right+' / '+total+' 题<br>累计已掌握 '+s.known+' / '+s.total+' 题'+(wrong.length?'<br>本轮 '+wrong.length+' 题没记住，已记入“需巩固”':'')+'</div>'+
      (wrong.length?'<div class="recite-btns"><button class="b-again" onclick="replayWrong()">重练本轮错题（'+wrong.length+'）</button></div>':'')+
      '<div style="margin-top:10px" class="recite-btns"><button class="b-known" onclick="setRFilter(\'weak\')">复习全部巩固题</button><button class="b-known" onclick="startRecite()">再来一轮</button></div></div>';
    return;
  }
  const c = qs[i];
  const pc = partOf(c.ch);
  const isFn = pc.part==='下篇';
  const st = cardState[c.id];
  const stTag = st==='known'?'<span style="position:absolute;top:12px;right:14px;font-size:11px;color:var(--ok)">已掌握</span>':(st==='again'?'<span style="position:absolute;top:12px;right:14px;font-size:11px;color:var(--warn)">需巩固</span>':'');
  wrap.innerHTML = bar +
    '<div class="card-wrap"><div class="flashcard" id="fc" onclick="flipCard()">'+
      '<span class="fc-tag '+(isFn?'fn':'cn')+'">'+esc(pc.no)+' · '+esc(pc.part)+'</span>'+stTag+
      '<div class="face"><div class="fc-q">'+esc(c.q)+'</div><div class="fc-hint">点卡片显示答案</div></div>'+
      '<div class="back"><div class="fc-a">'+fmt(c.a)+'</div></div>'+
    '</div></div>'+
    '<div class="recite-btns"><button class="b-known" onclick="markCard(1)">记住了</button><button class="b-again" onclick="markCard(0)">没记住</button></div>';
}
function flipCard(){ $('#fc').classList.toggle('flip'); }
function markCard(ok){
  const c = current.rq[current.ri];
  c._again = !ok;
  if(ok){ current.right++; cardState[c.id]='known'; }
  else { cardState[c.id]='again'; }
  store.set('cardstate',cardState);
  current.ri++;
  saveProg();
  renderStats();
  showCard();
}
function replayWrong(){
  current.rq = current.rq.filter(x=>x._again).map(x=>({...x,_again:false}));
  current.ri = 0; current.right = 0;
  saveProg();
  showCard();
}
function resetProgress(){
  if(!confirm('确定清空全部背诵进度（记住/没记住记录）？')) return;
  Object.keys(cardState).forEach(k=>delete cardState[k]);
  store.set('cardstate',{});
  store.set('recite',null);
  renderRecite();
}

    '<div class="dw-meta"><span class="chip" onclick="gotoChapter(\''+c.id+'\')">'+esc(c.no+' '+c.title.replace(/^第.章\s*/,''))+'</span></div>'+
    (t.img? '<div class="dw-img"><img src="'+t.img+'" alt="'+esc(t.name)+'" loading="lazy" onclick="this.classList.toggle(\'big\')"><div class="dw-img-cap">'+esc(t.img_cap||t.name+'（实景/作品图）')+'</div></div>' : '')+
    '<div class="dw-row"><div class="lb">概念解释</div><div class="term-def">'+fmt(t.def)+'</div></div>'+
    (ws?'<div class="dw-row"><div class="lb">相关人物（点击查看）</div><div>'+ws+'</div></div>':'')+
    (ts?'<div class="dw-row"><div class="lb">相关概念（可继续跳转）</div><div>'+ts+'</div></div>':'');
}
function renderQA(chid, idx, back){
  const qa = QA[chid][idx]; if(!qa) return;
  const c = partOf(chid);
  const isFn = c.part==='下篇';
  const level = idx===0?'识记':(idx===1?'分析':'思辨与应用');
  const qBody = qa.q.replace(/^考点\d+（(识记|分析|思辨与应用)）：/, '');
  const links = (qa.links||[]).map(r=>{
    const w = WKIDX[r];
    if(w) return '<span class="chip w" onclick="openWork(\''+w.id+'\')">'+esc(w.name)+'</span>';
    const t = TMIDX[r];
    if(t) return '<span class="chip" onclick="openTerm(\''+t.id+'\')">'+esc(t.name)+'</span>';
    const c2 = partOf(r);
    if(c2) return '<span class="chip" onclick="gotoChapter(\''+c2.id+'\')">'+esc(c2.no+' '+c2.title.replace(/^第.章\s*/,''))+'</span>';
    return '';
  }).join('');
  $('#drsheet').innerHTML = back +
    '<div class="grip"></div>'+
    '<div class="qa-head"><span class="qa-level '+(isFn?'fn':'cn')+'">'+level+'</span><span class="dw-name serif">考点'+(idx+1)+'</span>'+
    '<span class="chip" onclick="gotoChapter(\''+chid+'\')">'+esc(c.no+' '+c.title.replace(/^第.章\s*/,''))+'</span></div>'+
    '<div class="qa-q">'+fmt(qBody)+'</div>'+
    '<div class="dw-row"><div class="lb">标准答案（可直接背诵）</div><div class="val"><ol class="qa-list">'+qa.answer.map(a=>'<li>'+fmt(a)+'</li>').join('')+'</ol></div></div>'+
    '<div class="dw-row"><div class="lb">怎么答题（结构模板）</div><div class="val"><ol class="qa-tpl">'+qa.template.map(t=>'<li>'+fmt(t)+'</li>').join('')+'</ol></div></div>'+
    (links?'<div class="dw-row"><div class="lb">相关知识点（点击跳转）</div><div>'+links+'</div></div>':'')+
    '<button class="qa-goto" onclick="dstack.length=0;$(\'#drawer\').classList.remove(\'open\')">返回本章继续学习</button>';
}

/* ===== 搜索 ===== */
function doSearch(){
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#qres');
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const res = [];
  WK.forEach(w=>{ if(w.name.toLowerCase().includes(q) || w.tags.some(t=>t.toLowerCase().includes(q))) res.push({k:'人物',t:w.name,go:()=>openWork(w.id)}); });
  TM.forEach(t=>{ if(t.name.includes(q) || t.def.includes(q)) res.push({k:'概念',t:t.name,go:()=>openTerm(t.id)}); });
  CH.forEach(c=>{ if(c.title.includes(q) || c.exam.join('').includes(q)) res.push({k:'章节',t:c.no+' '+c.title,go:()=>{closeSearch();gotoChapter(c.id);}}); });
  CD.forEach(cd=>{ if(cd.q.includes(q)) res.push({k:'考点',t:cd.q.slice(0,26)+'…',go:()=>{closeSearch();renderRecite();}}); });
  box.innerHTML = res.slice(0,12).map(r=>'<div class="it" onclick="r.go()"><span class="k">'+r.k+'</span>'+esc(r.t)+'</div>').join('') || '<div class="it" style="color:var(--ink2)">无匹配结果</div>';
  box.classList.add('open');
}
function closeSearch(){ const b=$('#qres'); if(b){b.classList.remove('open');b.innerHTML='';} }

/* ===== 事件 ===== */
$('#q').addEventListener('input', doSearch);
$('#q').addEventListener('focus', doSearch);
document.addEventListener('click', e=>{ if(!e.target.closest('.searchwrap')) closeSearch(); });
/* 板块折叠/展开：事件委托兜底（内联 onclick 在某些环境下不可靠） */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  if(t.closest('.exam-item') || t.closest('.drawer') || t.closest('.searchwrap') || t.closest('.bottom-nav')) return;
  var sb = t.closest('.sec-block');
  if(sb) sb.classList.toggle('open');
});
$('#drmask').addEventListener('click', closeDrawer);
window.addEventListener('hashchange', router);
router();
</script>
